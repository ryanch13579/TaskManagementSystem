$kind: collection
description: "API collection for the Task Management System backend. Base URL: `http://localhost:5000/api`. Authentication uses JWT Bearer tokens obtained from the Login endpoint."
auth:
  type: bearer
  credentials:
    token: "{{token}}"
variables:
  - key: baseUrl
    value: http://localhost:5000/api
    disabled: false
  - key: email
    value: ""
    disabled: false
  - key: admin_password
    value: ""
    disabled: false
  - key: new_admin_password
    value: ""
    disabled: false
  - key: token
    secret: true
    disabled: false
  - key: userId
    value: ""
    disabled: false
  - key: planId
    value: ""
    disabled: false
  - key: taskId
    value: ""
    disabled: false
  - key: appId
    value: ""
    disabled: false
  - key: state
    value: ""
    disabled: false
