$kind: http-request
method: PUT
url: "{{baseUrl}}/api/auth/change-password/{{userId}}"
order: 3000
description: Changes the password for the user with the given ID. Requires a valid JWT. New password must be 8-10 characters with at least one letter, number, and special character.
auth:
  type: bearer
  credentials:
    token: "{{token}}"
headers:
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \    \"currentPassword\": \"admin2\",\r

    \    \"newPassword\": \"admin1234@\"\r

    }"
scripts:
  - type: afterResponse
    code: |-
      // Security: Change Password endpoint tests
      pm.test("Unauthenticated request is rejected with 401", function () {
        if (pm.response.code === 401) {
          const body = pm.response.json();
          pm.expect(body).to.have.property("message");
        }
      });

      pm.test("Response does not leak sensitive data", function () {
        const body = pm.response.json();
        pm.expect(body).to.not.have.property("password");
        pm.expect(body).to.not.have.property("token");
      });

      pm.test("Successful password change returns 200", function () {
        if (pm.response.code === 200) {
          const body = pm.response.json();
          pm.expect(body).to.have.property("message");
        }
      });

      pm.test("Weak password is rejected with 400", function () {
        if (pm.response.code === 400) {
          const body = pm.response.json();
          pm.expect(body).to.have.property("message");
        }
      });
    language: text/javascript
