$kind: http-request
name: Get All Groups
method: GET
url: '{{baseUrl}}/groups'
order: 2000
description: Returns a list of all groups (id, name).
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // Security: Get All Groups endpoint tests
      pm.test("Unauthenticated request is rejected with 401", function () {
        if (pm.response.code === 401) {
          const body = pm.response.json();
          pm.expect(body).to.have.property("message");
        }
      });

      pm.test("Groups list is an array when authorized", function () {
        if (pm.response.code === 200) {
          const groups = pm.response.json();
          pm.expect(groups).to.be.an("array");
          groups.forEach(function (group) {
            pm.expect(group).to.have.property("id");
            pm.expect(group).to.have.property("name");
          });
        }
      });
